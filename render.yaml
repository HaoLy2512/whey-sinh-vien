services:
  - type: web
    name: whey-sinh-vien
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SETUP_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
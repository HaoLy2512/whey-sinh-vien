databases:
  - name: vitacore-db
    plan: free
    region: singapore

services:
  - type: web
    name: whey-sinh-vien
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.postgresql.prisma && npx prisma db push --schema=prisma/schema.postgresql.prisma && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vitacore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SETUP_SECRET
        sync: false